<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karinne Rosalini</title>
    <style>
        body {
            background: #0d0d0d;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        #nome {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 32px;
            letter-spacing: 1px;
            text-align: center;
            padding: 0 15px;
        }
        #botao {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(145deg, #1db954, #158f40);
            color: white;
            font-size: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(29, 185, 84, 0.45);
            transition: transform 0.15s ease, background 0.3s ease, box-shadow 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        #botao:active {
            transform: scale(0.92);
        }
        #botao.tocando {
            background: linear-gradient(145deg, #ff5500, #cc4400);
            box-shadow: 0 10px 35px rgba(255, 85, 0, 0.5);
            animation: pulsar 1.5s infinite;
        }
        @keyframes pulsar {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }
        #texto {
            margin-top: 28px;
            font-size: 20px;
            font-weight: 500;
            color: #ccc;
            text-align: center;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <div id="nome">Karinne Rosalini</div>
    <button id="botao" onclick="alternarAudio()">▶</button>
    <div id="texto">Toque para ouvir</div>

    <audio id="player" autoplay></audio>

    <script>
        // ==========================================
        // CONFIGURAÇÃO DO ÁUDIO
        // ==========================================
        const NOME_DA_PESSOA = "Karinne Rosalini"; 
        const ARQUIVO_AUDIO  = "música um.mp3"; 
        // ==========================================

        document.title = NOME_DA_PESSOA;
        document.getElementById('nome').innerText = NOME_DA_PESSOA;

        const audio = document.getElementById('player');
        audio.src = encodeURI(ARQUIVO_AUDIO);

        const botao = document.getElementById('botao');
        const texto = document.getElementById('texto');

        function atualizarVisual(tocando) {
            if (tocando) {
                botao.innerHTML = '⏸';
                botao.classList.add('tocando');
                texto.innerText = 'Tocando...';
            } else {
                botao.innerHTML = '▶';
                botao.classList.remove('tocando');
                texto.innerText = 'Toque para ouvir';
            }
        }

        audio.play().then(() => atualizarVisual(true)).catch(() => atualizarVisual(false));

        function alternarAudio() {
            if (audio.paused) {
                audio.play();
                atualizarVisual(true);
            } else {
                audio.pause();
                atualizarVisual(false);
            }
        }

        audio.onended = () => atualizarVisual(false);
    </script>
</body>
</html>
