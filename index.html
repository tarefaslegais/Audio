<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karinne Rosalini</title>
    <style>
        body {
            background: #0d0d0d;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        #nome {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 32px;
            letter-spacing: 1px;
            text-align: center;
            padding: 0 15px;
        }
        #botao {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            border: 4px solid #1db954;
            padding: 0;
            background: transparent;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(29, 185, 84, 0.45);
            transition: transform 0.15s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        #imagem-botao {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        #botao:active {
            transform: scale(0.92);
        }
        #botao.tocando {
            border-color: #ff5500;
            box-shadow: 0 10px 35px rgba(255, 85, 0, 0.65);
            -webkit-animation: pulsar 1.5s infinite;
            animation: pulsar 1.5s infinite;
        }
        @-webkit-keyframes pulsar {
            0% { -webkit-transform: scale(1); }
            50% { -webkit-transform: scale(1.06); }
            100% { -webkit-transform: scale(1); }
        }
        @keyframes pulsar {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }
        #texto {
            margin-top: 28px;
            font-size: 20px;
            font-weight: 500;
            color: #ccc;
            text-align: center;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <div id="nome">Karinne Rosalini</div>

    <button id="botao" onclick="alternarAudio()" aria-label="Tocar áudio">
        <img id="imagem-botao" src="foto.jpg" alt="Toque para ouvir">
    </button>

    <div id="texto">Toque na imagem para ouvir</div>

    <audio id="player" preload="auto"></audio>

    <script>
        // ==========================================
        // CONFIGURAÇÃO RÁPIDA (MUDE APENAS AQUI)
        // ==========================================
        const NOME_DA_PESSOA = "Karinne Rosalini"; 
        const ARQUIVO_AUDIO  = "música dois.mp3";
        const ARQUIVO_IMAGEM = "foto.jpg";
        // ==========================================

        document.title = NOME_DA_PESSOA;
        document.getElementById('nome').innerText = NOME_DA_PESSOA;
        document.getElementById('imagem-botao').src = encodeURI(ARQUIVO_IMAGEM);

        const audio = document.getElementById('player');
        audio.src = encodeURI(ARQUIVO_AUDIO);

        const botao = document.getElementById('botao');
        const texto = document.getElementById('texto');

        function atualizarVisual(tocando) {
            if (tocando) {
                botao.classList.add('tocando');
                texto.innerText = 'Tocando...';
            } else {
                botao.classList.remove('tocando');
                texto.innerText = 'Toque na imagem para ouvir';
            }
        }

        function alternarAudio() {
            if (audio.paused) {
                audio.play()
                    .then(() => atualizarVisual(true))
                    .catch(() => {
                        texto.innerText = 'Erro: verifique o arquivo de áudio';
                    });
            } else {
                audio.pause();
                atualizarVisual(false);
            }
        }

        audio.onended = () => atualizarVisual(false);
    </script>
</body>
</html>
